<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RRA Boathouse</title>
<meta name="theme-color" content="#2E99CE">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --blue:#2E99CE; --blue-dark:#20749e; --blue-pale:#e3f2f9;
    --red:#EE3A3B; --red-pale:#fdeaea;
    --amber:#d97706; --amber-pale:#fdf3e3;
    --green:#1a7f4e; --green-pale:#e5f5ec;
    --ink:#16323f; --muted:#5b7482; --line:#dde7ec; --bg:#f2f6f8; --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}

  header{position:sticky; top:0; z-index:30; background:var(--card); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px; padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top));}
  header img{height:27px; display:block; flex:none;}
  header .h-title{flex:1; min-width:0;}
  header .h-title b{font-size:16px; display:block; line-height:1.15;}
  header .h-title span{font-size:11px; color:var(--muted); display:block;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .iconbtn{border:1px solid var(--line); background:var(--card); color:var(--blue-dark); flex:none;
    border-radius:10px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .iconbtn:active{background:var(--blue-pale);}
  .iconbtn svg{width:20px; height:20px;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #mockbar{background:#fff6d9; color:#7a5b00; border-bottom:1px solid #f0dfa0;
    font-size:12.5px; padding:7px 14px; text-align:center;}
  #offlinebar{background:var(--red-pale); color:var(--red); border-bottom:1px solid #f4c3c3;
    font-size:12.5px; padding:7px 14px; text-align:center; font-weight:600;}

  main{max-width:520px; margin:0 auto; padding:14px;}
  section.view{display:none;}
  section.view.active{display:block;}
  h2{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:18px 2px 8px;}
  h2:first-child{margin-top:2px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px;}
  .card.overdue{border-color:var(--red); box-shadow:0 0 0 1px var(--red) inset;}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1; min-width:0;}

  .boatname{font-weight:700; font-size:16.5px;}
  .sub{color:var(--muted); font-size:13px; margin-top:2px;}
  .chip{display:inline-block; font-size:11px; font-weight:700; border-radius:999px; padding:3px 8px; vertical-align:middle; white-space:nowrap;}
  .chip.type{background:var(--blue-pale); color:var(--blue-dark);}
  .chip.qr{background:#eef2f5; color:var(--muted); border:1px solid var(--line);}
  .chip.ok{background:var(--green-pale); color:var(--green);}
  .chip.out{background:var(--blue-pale); color:var(--blue-dark);}
  .chip.warn{background:var(--amber-pale); color:var(--amber);}
  .chip.bad{background:var(--red-pale); color:var(--red);}
  .chip.own{background:#eef2f5; color:var(--muted);}

  .btn{display:block; width:100%; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700;
    background:var(--blue); color:#fff; cursor:pointer;}
  .btn:active{background:var(--blue-dark);}
  .btn.secondary{background:var(--card); color:var(--blue-dark); border:1.5px solid var(--blue);}
  .btn.secondary:active{background:var(--blue-pale);}
  .btn.danger{background:var(--red);}
  .btn.small{width:auto; padding:9px 14px; font-size:14px; border-radius:10px;}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--ink); font-weight:600;}
  .btn:disabled{opacity:.5;}

  label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 2px 5px;}
  select,input[type=text],textarea{width:100%; font-size:16px; padding:12px; border:1px solid var(--line);
    border-radius:12px; background:var(--card); color:var(--ink); appearance:none; -webkit-appearance:none;}
  .selwrap{position:relative;}
  .selwrap:after{content:""; position:absolute; right:14px; top:50%; width:8px; height:8px; margin-top:-6px;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); pointer-events:none;}
  textarea{min-height:74px; resize:vertical;}

  .seg{display:flex; background:#e8eef2; border-radius:12px; padding:4px; gap:4px;}
  .seg button{flex:1; border:none; border-radius:9px; padding:10px; font-size:14.5px; font-weight:700;
    background:none; color:var(--muted); cursor:pointer;}
  .seg button.active{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12);}

  .info{background:var(--blue-pale); border-radius:12px; padding:10px 12px; font-size:13.5px; color:var(--blue-dark); margin-top:8px;}
  .info.warn{background:var(--amber-pale); color:var(--amber);}
  .info.bad{background:var(--red-pale); color:var(--red);}

  .empty{color:var(--muted); text-align:center; padding:26px 10px; font-size:14.5px;}
  .empty b{display:block; font-size:16px; color:var(--ink); margin-bottom:4px;}

  .stats{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .stat{flex:1; min-width:56px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 3px; text-align:center;}
  .stat b{display:block; font-size:18px;}
  .stat span{font-size:10px; color:var(--muted);}

  .boatrow{display:flex; align-items:center; gap:8px; padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
  .boatrow:last-child{border-bottom:none;}
  .boatrow .meta{font-size:12.5px; color:var(--muted); margin-top:1px;}
  .usebar{height:4px; background:#e8eef2; border-radius:2px; margin-top:6px; overflow:hidden;}
  .usebar i{display:block; height:100%; background:var(--green); border-radius:2px;}
  .usebar i.warn{background:var(--amber);} .usebar i.bad{background:var(--red);}

  nav#tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom);}
  nav#tabbar button{flex:1; border:none; background:none; padding:8px 0 9px; color:var(--muted); cursor:pointer;
    font-size:10.5px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav#tabbar button svg{width:23px; height:23px;}
  nav#tabbar button.active{color:var(--blue-dark);}

  #modalback{position:fixed; inset:0; background:rgba(10,30,40,.5); z-index:40; display:none; align-items:flex-end; justify-content:center;}
  #modalback.open{display:flex;}
  #modal{background:var(--card); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:86vh; overflow:auto;}
  #modal h3{margin:0 0 4px; font-size:18px;}
  #modal .sub{margin-bottom:10px;}

  #toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(88px + env(safe-area-inset-bottom));
    background:var(--ink); color:#fff; font-size:14px; padding:11px 18px; border-radius:999px; z-index:60;
    opacity:0; pointer-events:none; transition:opacity .25s; max-width:88%; text-align:center;}
  #toast.show{opacity:1;}
  #toast.err{background:var(--red);}

  .flagitem{background:var(--amber-pale); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:14px;}
  .flagitem .who{font-size:12px; color:var(--muted); margin-top:2px;}
  .flagitem .row{margin-top:6px;}

  .resline{display:flex; align-items:center; gap:8px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:14px;}
  .resline:last-child{border-bottom:none;}
  .resline .t{font-weight:700; white-space:nowrap;}
  .datehead{font-size:12px; font-weight:700; color:var(--muted); margin:10px 2px 4px; text-transform:uppercase; letter-spacing:.06em;}
  .linkbtn{background:none; border:none; color:var(--red); font-size:13px; font-weight:700; cursor:pointer; padding:6px;}
  .linkbtn.edit{color:var(--blue-dark);}
  .chip.wc{background:#eef4ea; color:#4a6b39;}
  .mt8{margin-top:8px;} .mt14{margin-top:14px;}
</style>
</head>

<main>

  <!-- ON THE WATER -->
  <section class="view active" id="view-lake">
    <h2>On the water</h2>
    <div id="lake-list"></div>
    <button class="btn mt8" onclick="go('out')">Take a boat out</button>
    <h2>Today's bookings</h2>
    <div id="lake-res" class="card"></div>
  </section>

  <!-- CHECK OUT -->
  <section class="view" id="view-out">
    <h2>Check out</h2>
    <div class="card">
      <label for="out-name">Your name</label>
      <div class="selwrap"><select id="out-name"></select></div>

      <label>What are you rowing?</label>
      <div class="seg" id="out-seg">
        <button class="active" data-mode="club" onclick="setOutMode('club')">Club boat</button>
        <button data-mode="own" onclick="setOutMode('own')">My own boat</button>
      </div>

      <div id="out-club">
        <label for="out-boat">Boat</label>
        <div class="selwrap"><select id="out-boat"></select></div>
        <div id="out-boatinfo"></div>
      </div>

      <div id="out-own" style="display:none">
        <label for="out-owndesc">Your boat (make it recognizable)</label>
        <input type="text" id="out-owndesc" placeholder="e.g. Yellow Peinert single">
      </div>

      <label for="out-crew">Who's with you? (optional)</label>
      <input type="text" id="out-crew" placeholder="e.g. bow: Leslie, stroke: me">

      <button class="btn mt14" id="out-go" onclick="doCheckout()">Launch</button>
    </div>
  </section>

  <!-- RESERVE -->
  <section class="view" id="view-reserve">
    <h2>Book a boat</h2>
    <div class="card">
      <label for="res-name">Your name</label>
      <div class="selwrap"><select id="res-name"></select></div>
      <label for="res-boat">Boat</label>
      <div class="selwrap"><select id="res-boat"></select></div>
      <label for="res-date">Day</label>
      <div class="selwrap"><select id="res-date"></select></div>
      <div class="row mt8">
        <div class="grow">
          <label for="res-start" style="margin-top:0">Start</label>
          <div class="selwrap"><select id="res-start"></select></div>
        </div>
        <div class="grow">
          <label for="res-dur" style="margin-top:0">For</label>
          <div class="selwrap"><select id="res-dur">
            <option value="60">1 hour</option>
            <option value="90" selected>1.5 hours</option>
            <option value="120">2 hours</option>
            <option value="180">3 hours</option>
          </select></div>
        </div>
      </div>
      <button class="btn mt14" id="res-go" onclick="doReserve()">Book it</button>
    </div>
    <h2>Upcoming bookings</h2>
    <div id="res-list" class="card"></div>
  </section>

  <!-- BOATS -->
  <section class="view" id="view-boats">
    <h2>Fleet</h2>
    <div class="stats" id="fleet-stats"></div>
    <div id="boats-list"></div>
  </section>

</main>

<nav id="tabbar">
  <button data-tab="lake" class="active" onclick="go('lake')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12c1.7 0 1.7-1.5 3.4-1.5S7 12 8.7 12s1.7-1.5 3.4-1.5S13.7 12 15.4 12s1.7-1.5 3.3-1.5S20.3 12 22 12"/><path d="M2 17c1.7 0 1.7-1.5 3.4-1.5S7 17 8.7 17s1.7-1.5 3.4-1.5S13.7 17 15.4 17s1.7-1.5 3.3-1.5S20.3 17 22 17"/></svg>
    On the Water</button>
  <button data-tab="out" onclick="go('out')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    Check Out</button>
  <button data-tab="reserve" onclick="go('reserve')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
    Reserve</button>
  <button data-tab="boats" onclick="go('boats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v4H9z"/><rect x="4" y="7" width="16" height="14" rx="2"/><path d="M8 12h8M8 16h5"/></svg>
    Boats</button>
</nav>

<div id="modalback" onclick="if(event.target===this) closeModal()"><div id="modal"></div></div>
<div id="toast"></div>

<script>
/* ============================================================ utilities === */
var MOCK = (location.protocol === 'file:');
var S = null;          // app state from server
var activeTab = 'lake';
var TYPE_ORDER = ['1x','2x','4x','4+'];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg, isErr){
  var t = $('toast'); t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.className=''; }, 3200);
}
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function elapsedLabel(epoch){
  var m = Math.max(0, Math.round((Date.now() - epoch)/60000));
  if (m < 60) return m + ' min';
  var h = Math.floor(m/60);
  return h + 'h ' + (m%60) + 'm';
}
function isOverdue(epoch){
  return S && (Date.now() - epoch) > S.settings.maxOutingHours * 3600 * 1000;
}
function normType(t){ t = String(t||'').toLowerCase(); return t === '1x' ? '1x' : t; }
function boatByName(name){
  for (var i=0;i<S.boats.length;i++) if (S.boats[i].name === name) return S.boats[i];
  return null;
}

/* API wrapper: same code path for live (google.script.run) and preview (mock) */
function api(fn, payload){
  if (MOCK) {
    return new Promise(function(resolve, reject){
      setTimeout(function(){ try{ resolve(mockApi(fn, payload||{})); }catch(e){ reject(e); } }, 250);
    });
  }
  var req = (fn === 'getState')
    ? fetch('api/state', { cache: 'no-store' })
    : fetch('api/action', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action: fn, payload: payload || {} }) });
  return req.then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok) throw new Error((j && j.error) || ('Server error (' + r.status + ')'));
      return j;
    });
  });
}
function mutate(fn, payload, btn){
  if (btn){ btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = 'One sec...'; }
  return api(fn, payload).then(function(resp){
    if (btn){ btn.disabled = false; btn.textContent = btn.dataset.t; }
    // Only adopt a fresh state if one came back. A server hiccup can answer
    // without one, and overwriting S with nothing would empty the screen.
    if (resp && resp.state){ S = resp.state; setOffline(false); }
    renderAll();
    if (!resp || !resp.ok){ toast((resp && resp.error) || 'That did not work.', true); return false; }
    return true;
  }).catch(function(e){
    if (btn){ btn.disabled = false; btn.textContent = btn.dataset.t; }
    toast('Connection problem: ' + (e && e.message ? e.message : e), true);
    return false;
  });
}

/* ============================================================== loading === */
function setOffline(on){
  var bar = $('offlinebar');
  if (bar) bar.style.display = on ? 'block' : 'none';
}
/* Most connection failures are a momentary blip, so try again once quietly
   before bothering anyone, and never wipe what is already on screen. */
function loadState(showSpin, isRetry){
  var ic = $('refreshbtn').firstElementChild;
  if (showSpin) ic.classList.add('spin');
  return api('getState').then(function(state){
    S = state; setOffline(false); renderAll(); ic.classList.remove('spin');
  }).catch(function(e){
    if (!isRetry){
      return new Promise(function(done){ setTimeout(done, 1500); })
        .then(function(){ return loadState(showSpin, true); });
    }
    ic.classList.remove('spin');
    setOffline(true);
    renderAll();
    if (S) toast('Could not refresh. Showing the last update.', true);
  });
}
$('refreshbtn').onclick = function(){ loadState(true); };
setInterval(function(){
  if (document.visibilityState === 'visible' && !$('modalback').classList.contains('open')) loadState(false);
}, 60000);
setInterval(function(){ if (activeTab === 'lake' && S) renderLake(); }, 30000);
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible') loadState(false);
});

/* ================================================================= tabs === */
function go(tab){
  activeTab = tab;
  document.querySelectorAll('section.view').forEach(function(v){ v.classList.remove('active'); });
  $('view-' + tab).classList.add('active');
  document.querySelectorAll('#tabbar button').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  window.scrollTo(0,0);
  renderAll();
}

/* ============================================================ rendering === */
function renderAll(){
  if (!S) return;
  syncAdminButton();
  fillNameSelects();
  if (activeTab === 'lake') renderLake();
  if (activeTab === 'out') renderOut();
  if (activeTab === 'reserve') renderReserve();
  if (activeTab === 'boats') renderBoats();
}

/* Gear is visible to everyone while the gate is open; after that, admins only. */
function syncAdminButton(){
  var open = Number(S.settings.adminOpen) === 1;
  var me = store('rraName') || '';
  var isAdmin = (S.allPeople || []).some(function(p){ return p.name === me && p.isAdmin; });
  $('adminbtn').style.display = (open || isAdmin) ? '' : 'none';
}

function fillNameSelects(){
  ['out-name','res-name'].forEach(function(id){
    var sel = $(id); var prev = sel.value || store('rraName') || '';
    var groups = {};
    S.roster.forEach(function(r){
      var g = r.program || 'Members';
      (groups[g] = groups[g] || []).push(r.name);
    });
    var html = '<option value="">Tap to pick your name</option>';
    Object.keys(groups).forEach(function(g){
      html += '<optgroup label="' + esc(g) + '">';
      groups[g].forEach(function(n){ html += '<option' + (n===prev?' selected':'') + '>' + esc(n) + '</option>'; });
      html += '</optgroup>';
    });
    sel.innerHTML = html;
    sel.onchange = function(){ if (sel.value) store('rraName', sel.value); syncNames(id, sel.value); };
  });
}
function syncNames(fromId, val){
  ['out-name','res-name'].forEach(function(id){ if (id !== fromId && val) $(id).value = val; });
}

/* --- Lake board --- */
function renderLake(){
  var host = $('lake-list');
  if (!S.onWater.length){
    host.innerHTML = '<div class="card"><div class="empty"><b>Nobody is out right now</b>Flat water waiting. Be the first one on it.</div></div>';
  } else {
    host.innerHTML = S.onWater.map(function(o){
      var od = isOverdue(o.outEpoch);
      return '<div class="card' + (od?' overdue':'') + '"><div class="row">' +
        '<div class="grow"><div class="boatname">' + esc(o.ownBoat ? o.boat.replace(/^OWN:\s*/,'') : o.boat) +
        (o.ownBoat ? ' <span class="chip own">own boat</span>' : '') +
        (od ? ' <span class="chip bad">OVERDUE</span>' : '') + '</div>' +
        '<div class="sub">' + esc(o.rower) + (o.crew ? ' · ' + esc(o.crew) : '') + '</div>' +
        '<div class="sub">Out since ' + esc(o.outLabel) + ' · ' + elapsedLabel(o.outEpoch) + '</div></div>' +
        '<button class="btn small secondary" onclick="openCheckin(\'' + esc(o.logId) + '\')">Check in</button>' +
        '</div></div>';
    }).join('');
  }
  var today = S.reservations.filter(function(r){ return r.dateStr === S.today; });
  $('lake-res').innerHTML = today.length
    ? today.map(function(r){
        return '<div class="resline"><span class="t">' + esc(r.startLabel) + '</span>' +
          '<span class="grow">' + esc(r.boat) + ' · ' + esc(r.name) + '</span></div>';
      }).join('')
    : '<div class="empty">No bookings today. The Reserve tab fixes that.</div>';
}

/* --- Check out --- */
var outMode = 'club';
function setOutMode(m){
  outMode = m;
  document.querySelectorAll('#out-seg button').forEach(function(b){ b.classList.toggle('active', b.dataset.mode === m); });
  $('out-club').style.display = m === 'club' ? '' : 'none';
  $('out-own').style.display = m === 'own' ? '' : 'none';
  $('out-go').textContent = m === 'own' ? 'Launch my boat' : 'Launch';
}
function renderOut(){
  var sel = $('out-boat'); var prev = sel.value;
  var byType = {};
  S.boats.forEach(function(b){ (byType[b.type] = byType[b.type] || []).push(b); });
  var html = '<option value="">Tap to pick a boat</option>';
  TYPE_ORDER.concat(Object.keys(byType).filter(function(t){ return TYPE_ORDER.indexOf(t) < 0; }))
    .forEach(function(t){
      if (!byType[t]) return;
      html += '<optgroup label="' + esc(labelForType(t)) + '">';
      byType[t].forEach(function(b){
        var suffix = '', dis = '';
        if (b.status !== 'Available'){ suffix = ' · out of service'; dis = ' disabled'; }
        else if (b.outBy){ suffix = ' · on the water'; dis = ' disabled'; }
        else if (b.maintenanceDue){ suffix = ' · service due'; }
        else if (b.openFlags){ suffix = ' · ' + b.openFlags + ' issue' + (b.openFlags>1?'s':''); }
        html += '<option value="' + esc(b.name) + '"' + dis + (b.name===prev?' selected':'') + '>' +
          esc(b.name) + wcSuffix(b) + suffix + '</option>';
      });
      html += '</optgroup>';
    });
  sel.innerHTML = html;
  sel.onchange = renderOutInfo;
  renderOutInfo();
}
function labelForType(t){
  return {'1x':'Singles (1x)','2x':'Doubles (2x)','4x':'Quads (4x)','4+':'Fours (4+)'}[t] || t;
}
/* Weight class helpers. Blank weight class simply shows nothing. */
function wcShort(w){
  return {'lightweight':'lwt','midweight':'mwt','heavyweight':'hwt'}[String(w||'').toLowerCase()] || '';
}
function wcSuffix(b){
  var s = wcShort(b.weightClass);
  return s ? ' (' + s + ')' : '';
}
function ymd(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function minLabel(m){
  var h=Math.floor(m/60), mm=m%60, ap=h>=12?'PM':'AM', h12=h%12===0?12:h%12;
  return h12+':'+('0'+mm).slice(-2)+' '+ap;
}
function dayLabel(dateStr){
  if (dateStr === S.today) return 'Today';
  return new Date(dateStr + 'T12:00:00').toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function renderOutInfo(){
  var host = $('out-boatinfo'); host.innerHTML = '';
  var b = boatByName($('out-boat').value);
  if (!b) return;
  var bits = [];
  if (b.maintenanceDue) bits.push('<div class="info warn">Service due: ' + b.usesSinceService + ' rows since last check (target ' + b.serviceInterval + '). Fine to row unless flagged, but tell the equipment crew.</div>');
  if (b.openFlags){
    var fl = S.flags.filter(function(f){ return f.boat === b.name; })
      .map(function(f){ return esc(f.issue); }).join(' · ');
    bits.push('<div class="info warn">Heads up: ' + fl + '</div>');
  }
  var resNow = S.reservations.filter(function(r){
    if (r.boat !== b.name || r.dateStr !== S.today) return false;
    var nowMin = new Date().getHours()*60 + new Date().getMinutes();
    return nowMin >= r.startMin - 60 && nowMin < r.endMin;
  });
  if (resNow.length) bits.push('<div class="info bad">Booked by ' + esc(resNow[0].name) + ' at ' + esc(resNow[0].startLabel) + '. If that is not you, grab a different boat.</div>');
  if (!bits.length && !b.quickRelease) bits.push('<div class="info">No quick release plates in this one: it rows with its own shoes.</div>');
  host.innerHTML = bits.join('');
}
function doCheckout(){
  var name = $('out-name').value;
  if (!name) return toast('Pick your name first.', true);
  var btn = $('out-go');
  if (outMode === 'own'){
    mutate('apiCheckoutOwn', { rower:name, boatDesc:$('out-owndesc').value, crew:$('out-crew').value }, btn)
      .then(function(okd){ if (okd){ afterLaunch(); } });
  } else {
    var boat = $('out-boat').value;
    if (!boat) return toast('Pick a boat.', true);
    mutate('apiCheckout', { rower:name, boat:boat, crew:$('out-crew').value }, btn)
      .then(function(okd){ if (okd){ afterLaunch(); } });
  }
}
function afterLaunch(){
  $('out-crew').value = ''; $('out-owndesc').value = '';
  toast('You are on the board. Row safe.');
  go('lake');
}

/* --- Check in --- */
function openCheckin(logId){
  var o = null;
  S.onWater.forEach(function(x){ if (x.logId === logId) o = x; });
  if (!o) return;
  var nm = o.ownBoat ? o.boat.replace(/^OWN:\s*/,'') : o.boat;
  openModal(
    '<h3>Back on land?</h3>' +
    '<div class="sub">' + esc(nm) + ' · ' + esc(o.rower) + ' · out ' + elapsedLabel(o.outEpoch) + '</div>' +
    (o.ownBoat ? '' :
      '<label for="ci-issue">Notice anything? (optional)</label>' +
      '<textarea id="ci-issue" placeholder="e.g. bow ball loose, seat sticking, oarlock cracked"></textarea>') +
    '<button class="btn mt14" id="ci-go">Check in</button>' +
    '<button class="btn ghost mt8" onclick="closeModal()">Not yet</button>'
  );
  $('ci-go').onclick = function(){
    var issue = $('ci-issue') ? $('ci-issue').value : '';
    mutate('apiCheckin', { logId:logId, issue:issue }, $('ci-go')).then(function(okd){
      if (okd){ closeModal(); toast(issue ? 'Checked in. Issue flagged for the equipment crew.' : 'Checked in. Nice row.'); }
    });
  };
}

/* --- Reserve --- */
/* Option builders, shared by the booking form and the edit sheet. */
function boatOptionsHtml(selected){
  var byType = {};
  S.boats.filter(function(b){ return b.status === 'Available' || b.name === selected; })
    .forEach(function(b){ (byType[b.type] = byType[b.type] || []).push(b); });
  var html = '<option value="">Tap to pick a boat</option>';
  TYPE_ORDER.concat(Object.keys(byType).filter(function(t){ return TYPE_ORDER.indexOf(t) < 0; }))
    .forEach(function(t){
      if (!byType[t]) return;
      html += '<optgroup label="' + esc(labelForType(t)) + '">';
      byType[t].forEach(function(b){
        html += '<option value="' + esc(b.name) + '"' + (b.name===selected?' selected':'') + '>' +
          esc(b.name) + wcSuffix(b) + '</option>';
      });
      html += '</optgroup>';
    });
  return html;
}
function dateOptionsHtml(selected){
  var html = '', d = new Date();
  for (var i = 0; i <= S.settings.windowDays; i++){
    var ds = ymd(d);
    var lbl = i===0 ? 'Today' : i===1 ? 'Tomorrow' : '';
    var nice = d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    html += '<option value="' + ds + '"' + (ds===selected?' selected':'') + '>' + (lbl ? lbl + ' · ' : '') + nice + '</option>';
    d.setDate(d.getDate()+1);
  }
  return html;
}
function startOptionsHtml(selected){
  var html = '';
  for (var m = 5*60; m <= 19*60; m += 15){
    html += '<option value="' + m + '"' + (m===selected?' selected':'') + '>' + minLabel(m) + '</option>';
  }
  return html;
}
function durOptionsHtml(selected){
  var opts = [[60,'1 hour'],[90,'1.5 hours'],[120,'2 hours'],[180,'3 hours']];
  if (selected && !opts.some(function(o){ return o[0] === selected; })){
    opts.push([selected, (selected/60).toFixed(1).replace('.0','') + ' hours']);
    opts.sort(function(a,b){ return a[0]-b[0]; });
  }
  return opts.map(function(o){
    return '<option value="' + o[0] + '"' + (o[0]===selected?' selected':'') + '>' + o[1] + '</option>';
  }).join('');
}

function renderReserve(){
  var sel = $('res-boat'); sel.innerHTML = boatOptionsHtml(sel.value);
  var dsel = $('res-date'); dsel.innerHTML = dateOptionsHtml(dsel.value);
  var ssel = $('res-start'); if (!ssel.options.length) ssel.innerHTML = startOptionsHtml(6*60);

  var host = $('res-list');
  if (!S.reservations.length){
    host.innerHTML = '<div class="empty">Nothing booked yet.</div>';
  } else {
    var byDate = {};
    S.reservations.forEach(function(r){ (byDate[r.dateStr] = byDate[r.dateStr] || []).push(r); });
    host.innerHTML = Object.keys(byDate).sort().map(function(ds){
      return '<div class="datehead">' + esc(dayLabel(ds)) + '</div>' + byDate[ds].map(function(r){
        return '<div class="resline"><span class="t">' + esc(r.startLabel) + '</span>' +
          '<span class="grow">' + esc(r.boat) + ' · ' + esc(r.name) + '</span>' +
          '<button class="linkbtn edit" onclick="openEditRes(\'' + esc(r.resId) + '\')">Edit</button></div>';
      }).join('');
    }).join('');
  }
}
function doReserve(){
  var name = $('res-name').value, boat = $('res-boat').value;
  if (!name) return toast('Pick your name first.', true);
  if (!boat) return toast('Pick a boat.', true);
  mutate('apiReserve', {
    rower:name, boat:boat, dateStr:$('res-date').value,
    startMin:parseInt($('res-start').value,10), durMin:parseInt($('res-dur').value,10)
  }, $('res-go')).then(function(okd){ if (okd) toast('Booked. See you at the dock.'); });
}

/* Change a booking: boat, day, start, or length. Cancelling lives here too. */
function openEditRes(resId){
  var r = null;
  S.reservations.forEach(function(x){ if (x.resId === resId) r = x; });
  if (!r) return;
  openModal(
    '<h3>Edit booking</h3>' +
    '<div class="sub">' + esc(r.name) + ' · ' + esc(r.boat) + ' · ' + esc(dayLabel(r.dateStr)) + ' at ' + esc(r.startLabel) + '</div>' +
    '<label for="ed-boat">Boat</label>' +
    '<div class="selwrap"><select id="ed-boat">' + boatOptionsHtml(r.boat) + '</select></div>' +
    '<label for="ed-date">Day</label>' +
    '<div class="selwrap"><select id="ed-date">' + dateOptionsHtml(r.dateStr) + '</select></div>' +
    '<div class="row mt8">' +
      '<div class="grow"><label for="ed-start" style="margin-top:0">Start</label>' +
      '<div class="selwrap"><select id="ed-start">' + startOptionsHtml(r.startMin) + '</select></div></div>' +
      '<div class="grow"><label for="ed-dur" style="margin-top:0">For</label>' +
      '<div class="selwrap"><select id="ed-dur">' + durOptionsHtml(r.endMin - r.startMin) + '</select></div></div>' +
    '</div>' +
    '<button class="btn mt14" id="ed-save">Save changes</button>' +
    '<button class="btn ghost mt8" onclick="closeModal()">Never mind</button>' +
    '<div class="info mt14">Booked by ' + esc(r.name) + '. If this is not your booking, check with them before changing it.</div>' +
    '<button class="btn danger mt8" id="ed-cancel">Cancel this booking</button>'
  );
  $('ed-save').onclick = function(){
    var boat = $('ed-boat').value;
    if (!boat) return toast('Pick a boat.', true);
    mutate('apiEditRes', {
      resId: resId, boat: boat, dateStr: $('ed-date').value,
      startMin: parseInt($('ed-start').value, 10), durMin: parseInt($('ed-dur').value, 10)
    }, $('ed-save')).then(function(okd){
      if (okd){ closeModal(); toast('Booking updated.'); }
    });
  };
  $('ed-cancel').onclick = function(){
    mutate('apiCancelRes', { resId: resId }, $('ed-cancel')).then(function(okd){
      if (okd){ closeModal(); toast('Booking cancelled.'); }
    });
  };
}

/* --- Boats / fleet --- */
function renderBoats(){
  var avail=0, out=0, flagged=0, oos=0, due=0;
  S.boats.forEach(function(b){
    if (b.status !== 'Available') oos++;
    else if (b.outBy) out++;
    else avail++;
    if (b.openFlags) flagged++;
    if (b.maintenanceDue) due++;
  });
  $('fleet-stats').innerHTML =
    '<div class="stat"><b>' + avail + '</b><span>ready</span></div>' +
    '<div class="stat"><b>' + out + '</b><span>on water</span></div>' +
    '<div class="stat"><b>' + due + '</b><span>service due</span></div>' +
    '<div class="stat"><b>' + flagged + '</b><span>flagged</span></div>' +
    '<div class="stat"><b>' + oos + '</b><span>out of service</span></div>';

  var byType = {};
  S.boats.forEach(function(b){ (byType[b.type] = byType[b.type] || []).push(b); });
  $('boats-list').innerHTML = TYPE_ORDER
    .concat(Object.keys(byType).filter(function(t){ return TYPE_ORDER.indexOf(t) < 0; }))
    .map(function(t){
      if (!byType[t]) return '';
      return '<h2>' + esc(labelForType(t)) + '</h2><div class="card">' + byType[t].map(function(b){
        var chip;
        if (b.status !== 'Available') chip = '<span class="chip bad">out of service</span>';
        else if (b.outBy) chip = '<span class="chip out">on water</span>';
        else if (b.maintenanceDue) chip = '<span class="chip warn">service due</span>';
        else if (b.openFlags) chip = '<span class="chip warn">' + b.openFlags + ' issue' + (b.openFlags>1?'s':'') + '</span>';
        else chip = '<span class="chip ok">ready</span>';
        var pct = b.serviceInterval > 0 ? Math.min(100, Math.round(100*b.usesSinceService/b.serviceInterval)) : 0;
        var cls = pct >= 100 ? 'bad' : pct >= 80 ? 'warn' : '';
        return '<div class="boatrow" onclick="openBoat(\'' + esc(b.name) + '\')">' +
          '<div class="grow"><b>' + esc(b.name) + '</b>' +
          (b.weightClass ? ' <span class="chip wc">' + esc(wcShort(b.weightClass)) + '</span>' : '') +
          (b.quickRelease ? ' <span class="chip qr">QR</span>' : '') +
          '<div class="meta">' + b.usesSinceService + ' of ' + b.serviceInterval + ' rows to next service · ' + b.usesTotal + ' total</div>' +
          '<div class="usebar"><i class="' + cls + '" style="width:' + pct + '%"></i></div></div>' +
          chip + '</div>';
      }).join('') + '</div>';
    }).join('');
}
function openBoat(name){
  var b = boatByName(name);
  if (!b) return;
  var flags = S.flags.filter(function(f){ return f.boat === name; });
  openModal(
    '<h3>' + esc(b.name) + ' <span class="chip type">' + esc(b.type) + '</span>' +
      (b.weightClass ? ' <span class="chip wc">' + esc(b.weightClass) + '</span>' : '') +
      (b.quickRelease ? ' <span class="chip qr">quick release</span>' : '') + '</h3>' +
    '<div class="sub">' + esc(b.status) + (b.outBy ? ' · on the water with ' + esc(b.outBy) : '') + '</div>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + b.usesTotal + '</b><span>total rows</span></div>' +
      '<div class="stat"><b>' + b.usesSinceService + '/' + b.serviceInterval + '</b><span>since service</span></div>' +
      '<div class="stat"><b style="font-size:13px; line-height:20px;">' + esc(b.lastServiced || 'never') + '</b><span>last serviced</span></div>' +
    '</div>' +
    (b.maintenanceDue ? '<div class="info warn">This boat hit its service milestone. Give it a once-over, then mark it serviced below.</div>' : '') +
    (b.notes ? '<div class="info mt8">' + esc(b.notes) + '</div>' : '') +
    (flags.length ? '<h2>Open issues</h2>' + flags.map(function(f){
      return '<div class="flagitem">' + esc(f.issue) +
        '<div class="who">' + esc(f.by || 'unknown') + (f.dateLabel ? ' · ' + esc(f.dateLabel) : '') + '</div>' +
        '<div class="row"><button class="btn small secondary" onclick="doResolveFlag(\'' + esc(f.flagId) + '\', this)">Mark fixed</button></div></div>';
    }).join('') : '') +
    '<h2>Report an issue</h2>' +
    '<textarea id="bd-issue" placeholder="What is wrong with ' + esc(b.name) + '?"></textarea>' +
    '<button class="btn secondary mt8" id="bd-flag">Add flag</button>' +
    '<h2>Maintenance</h2>' +
    '<button class="btn ghost" id="bd-serviced">Mark serviced (resets counter)</button>'
  );
  $('bd-flag').onclick = function(){
    var t = $('bd-issue').value.trim();
    if (!t) return toast('Describe the issue first.', true);
    mutate('apiAddFlag', { boat:name, issue:t, rower: $('out-name').value || store('rraName') || '' }, $('bd-flag'))
      .then(function(okd){ if (okd){ closeModal(); toast('Flag added. Thanks for the eyes.'); } });
  };
  $('bd-serviced').onclick = function(){
    mutate('apiMarkServiced', { boat:name }, $('bd-serviced'))
      .then(function(okd){ if (okd){ closeModal(); toast(name + ' marked serviced. Counter reset.'); } });
  };
}

/* ============================================================ mock data === */
/* Preview mode only. The deployed app talks to the Google Sheet instead.   */
function mockApi(fn, p){
  var M = window._MDB;
  function state(){
    var openByBoat = {};
    M.flags.forEach(function(f){ if (f.status==='Open') openByBoat[f.boat] = (openByBoat[f.boat]||0)+1; });
    var outBy = {};
    M.log.forEach(function(l){ if (!l.inAt && !l.ownBoat) outBy[l.boat] = l.rower; });
    return {
      now: Date.now(),
      today: mockToday(),
      settings: M.settings || { maxOutingHours: 3, defaultInterval: 50, windowDays: 7, adminOpen: 1 },
      boats: M.boats.map(function(b){ return {
        name:b.name, type:b.type, quickRelease:b.qr, status:b.status,
        usesTotal:b.total, usesSinceService:b.since, serviceInterval:50,
        lastServiced:b.last||'', notes:b.notes||'',
        maintenanceDue: b.since >= 50, openFlags: openByBoat[b.name]||0, outBy: outBy[b.name]||'',
        weightClass: b.wc || ''
      };}),
        roster: M.roster.filter(function(r){ return r.active !== false; }),
      allPeople: M.roster,
      onWater: M.log.filter(function(l){ return !l.inAt; }).map(function(l){ return {
        logId:l.id, boat:l.boat, ownBoat:l.ownBoat, rower:l.rower, crew:l.crew||'',
        outEpoch:l.outAt, outLabel:new Date(l.outAt).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})
      };}).sort(function(a,b){ return a.outEpoch-b.outEpoch; }),
      reservations: M.res.filter(function(r){ return r.status==='Booked' && r.dateStr >= mockToday(); })
        .map(function(r){ return {
          resId:r.id, boat:r.boat, name:r.name, dateStr:r.dateStr, startMin:r.s, endMin:r.e,
          startLabel:minLbl(r.s), endLabel:minLbl(r.e)
        };}).sort(function(a,b){ return a.dateStr===b.dateStr ? a.startMin-b.startMin : (a.dateStr<b.dateStr?-1:1); }),
      flags: M.flags.filter(function(f){ return f.status==='Open'; }).map(function(f){ return {
        flagId:f.id, boat:f.boat, issue:f.issue, by:f.by, dateLabel:f.date
      };})
    };
  }
  function minLbl(m){ var h=Math.floor(m/60), mm=m%60, ap=h>=12?'PM':'AM', h12=h%12===0?12:h%12;
    return h12+':'+('0'+mm).slice(-2)+' '+ap; }
  function mockToday(){ var d=new Date();
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function okr(){ return { ok:true, state:state() }; }
  function failr(msg){ return { ok:false, error:msg, state:state() }; }

  switch(fn){
    case 'getState': return state();
    case 'apiCheckout': {
      var st = state(), tgt = null;
      st.boats.forEach(function(b){ if (b.name===p.boat) tgt=b; });
      if (!tgt) return failr('Boat not found.');
      if (tgt.status!=='Available') return failr(p.boat+' is out of service.');
      if (tgt.outBy) return failr(p.boat+' is already on the water with '+tgt.outBy+'.');
      M.log.push({ id:'L'+Date.now(), boat:p.boat, ownBoat:false, rower:p.rower, crew:p.crew, outAt:Date.now(), inAt:null });
      return okr();
    }
    case 'apiCheckoutOwn':
      M.log.push({ id:'L'+Date.now(), boat:'OWN: '+(p.boatDesc||'private boat'), ownBoat:true, rower:p.rower, crew:p.crew, outAt:Date.now(), inAt:null });
      return okr();
    case 'apiCheckin': {
      var hit = null;
      M.log.forEach(function(l){ if (l.id===p.logId) hit=l; });
      if (!hit || hit.inAt) return failr('Already checked in.');
      hit.inAt = Date.now();
      if (!hit.ownBoat) M.boats.forEach(function(b){ if (b.name===hit.boat){ b.total++; b.since++; } });
      if (p.issue && !hit.ownBoat) M.flags.push({ id:'F'+Date.now(), boat:hit.boat, issue:p.issue, by:hit.rower, date:'today', status:'Open' });
      return okr();
    }
    case 'apiReserve': {
      var conf = M.res.filter(function(r){ return r.status==='Booked' && r.boat===p.boat && r.dateStr===p.dateStr &&
        p.startMin < r.e && (p.startMin+p.durMin) > r.s; });
      if (conf.length) return failr(p.boat+' is already booked then: '+conf[0].name+' ('+minLbl(conf[0].s)+' to '+minLbl(conf[0].e)+')');
      M.res.push({ id:'R'+Date.now(), boat:p.boat, name:p.rower, dateStr:p.dateStr, s:p.startMin, e:p.startMin+p.durMin, status:'Booked' });
      return okr();
    }
    case 'apiCancelRes':
      M.res.forEach(function(r){ if (r.id===p.resId) r.status='Cancelled'; });
      return okr();
    case 'apiAddFlag':
      M.flags.push({ id:'F'+Date.now(), boat:p.boat, issue:p.issue, by:p.rower||'someone', date:'today', status:'Open' });
      return okr();
    case 'apiResolveFlag':
      M.flags.forEach(function(f){ if (f.id===p.flagId) f.status='Resolved'; });
      return okr();
    case 'apiMarkServiced':
      M.boats.forEach(function(b){ if (b.name===p.boat){ b.since=0; b.last='today'; } });
      return okr();
    case 'apiSaveBoat': {
      var nm = String(p.name||'').toUpperCase();
      if (!nm) return failr('Give the boat a name.');
      if (!p.originalName){
        if (M.boats.some(function(b){ return b.name===nm; })) return failr('There is already a boat called '+nm+'.');
        M.boats.push({ name:nm, type:p.type, qr:!!p.quickRelease, status:p.status, total:0, since:0,
                       notes:p.notes||'', wc:p.weightClass||'' });
        return okr();
      }
      M.boats.forEach(function(b){
        if (b.name===p.originalName){
          b.name=nm; b.type=p.type; b.qr=!!p.quickRelease; b.status=p.status;
          b.notes=p.notes||''; b.wc=p.weightClass||'';
        }
      });
      M.flags.forEach(function(f){ if (f.boat===p.originalName) f.boat=nm; });
      M.log.forEach(function(l){ if (l.boat===p.originalName) l.boat=nm; });
      M.res.forEach(function(r){ if (r.boat===p.originalName) r.boat=nm; });
      return okr();
    }
    case 'apiDeleteBoat':
      M.boats = M.boats.filter(function(b){ return b.name !== p.name; });
      return okr();
    case 'apiSaveMember': {
      var pn = String(p.name||'').trim();
      if (!pn) return failr('Enter a name.');
      if (!p.originalName){
        if (M.roster.some(function(r){ return r.name===pn; })) return failr(pn+' is already on the roster.');
        M.roster.push({ name:pn, program:p.program, active:p.active!==false, isAdmin:!!p.isAdmin });
        return okr();
      }
      M.roster.forEach(function(r){
        if (r.name===p.originalName){ r.name=pn; r.program=p.program; r.active=p.active!==false; r.isAdmin=!!p.isAdmin; }
      });
      return okr();
    }
    case 'apiDeleteMember':
      M.roster = M.roster.filter(function(r){ return r.name !== p.name; });
      return okr();
    case 'apiSaveSettings':
      if (!p.adminOpen && !M.roster.some(function(r){ return r.isAdmin; }))
        return failr('Mark at least one person as an admin before locking the gear.');
      M.settings = { windowDays:parseInt(p.windowDays,10), defaultInterval:parseInt(p.defaultInterval,10),
                     maxOutingHours:parseInt(p.maxOutingHours,10), adminOpen: p.adminOpen ? 1 : 0 };
      return okr();
  }
  return failr('Unknown call.');
}
